[project]
name = "ai-trader-homeassistant"
version = "0.1.0"
description = "Home Assistant integration for the AI Trader app"
requires-python = ">=3.13"

[dependency-groups]
test = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# German texts contain typographic quotes and multiplication signs on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]
